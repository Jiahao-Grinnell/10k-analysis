# Pipeline settings. Relative paths are resolved against this file's folder.

[paths]
raw = "10K_Filings"          # read-only input
markdown = "Markdown_10K"    # conversion output; existing files are never rewritten
outputs = "outputs"          # per-stage outputs
runs = "runs"                # status database and logs

[tokens]
encoding = "o200k_base"
cache_dir = ".cache/tiktoken"

[segment]
chunk_max_tokens = 2000

[classify]
backend = "openai"               # "openai" = any OpenAI-compatible local server; "fake" = test stand-in
base_url = "http://127.0.0.1:8080"
model_tag = ""                   # set when a local model is chosen (TASK-06/07)
parallel_requests = 4            # concurrent requests, always chunks of the same filing
timeout_seconds = 300
max_output_tokens = 256
context_tokens = 300
prompt_version = "classify_v1"
prompts_dir = "prompts"

[classify.chat_template_kwargs]
enable_thinking = false

[keep]
# Numbered cross-references in kept text ("see Note 7", "Item 8", "Exhibit 13") keep their target
# in the same filing. Remove a kind to stop following it; only classify reruns, without model requests.
reference_kinds = ["note", "item", "exhibit"]

[compact]
# Deterministic compaction of the kept text (pipeline/compact/rules.py). Only rules that save tokens
# on `compact --profile` are listed. Changing this list reruns compact + publish only.
rules = ["html_minify", "cell_whitespace", "remove_empty_wrappers", "unwrap_cell_wrappers", "html_whitespace",
         "merge_symbol_cells", "drop_empty_rows", "drop_empty_columns", "table_to_pipe", "prose_whitespace"]

[disk]
min_free_gb = 50                 # monitor warns below this; long runs will pause (TASK-12)

[gpu]
# 16,376 MiB physical; keep headroom for Windows and the display.
vram_budget_mib = 14336
